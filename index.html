<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nilesh Meghani · Senior Product Designer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Nilesh Meghani, Senior Product Designer. 9+ years designing product pages, carts and checkouts for eCommerce and SaaS. CXL-certified in conversion optimisation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Work+Sans:ital,wght@0,300..700;1,400..500&display=swap">

<style>
:root{
  /* Layout: one centred 1240px column laid on a 64px check grid. Light bands
     alternate with a single dark dot-grid band; the work piles up as sticky
     cards; lime is kept for markers, live states and the one thing to press. */
  color-scheme:light;
  --paper:#FEFEFE;
  --paper-2:#F8F8F7;
  --paper-3:#EFEFEC;
  --white:#FFFFFF;
  --chrome:#F3F3F1;
  --chrome-dot:#D5D5D1;
  --grid:#E4E4E0;
  --dots:#D1D1CD;
  --line:#DBDBD7;
  --line-2:#CFCFCA;
  --ink:#0F0F0F;
  --ink-2:#181818;
  --ink-3:#2C2C2B;
  --pill:#1B1B1A;
  --text:#383837;
  --muted:#686864;
  --faint:#8B8B86;
  --on-dark:#F3F3F0;
  --on-dark-2:#A7A7A2;
  --lime:#DCFA37;
  --lime-2:#C6E81C;

  --d:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --b:"Work Sans","Helvetica Neue",Arial,sans-serif;

  --maxw:1240px;
  --gut:clamp(16px,4.5vw,56px);
  --sec:clamp(88px,10vw,144px);
  --navh:68px;
  --r-lg:24px;
  --r-md:16px;
  --ease:cubic-bezier(.22,.8,.24,1);
  --shadow:0 1px 2px rgba(15,15,15,.05),0 22px 44px -26px rgba(15,15,15,.30);
  --shadow-lg:0 2px 4px rgba(15,15,15,.05),0 40px 80px -36px rgba(15,15,15,.42);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(var(--navh) + env(safe-area-inset-top,0px) + 16px)}
body{margin:0;background:var(--paper);color:var(--text);font:400 16px/1.6 var(--b);letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--paper)}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
button{font:inherit;color:inherit}
::selection{background:var(--lime);color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
.dark :focus-visible{outline-color:var(--lime)}
.wrap{width:100%;max-width:calc(var(--maxw) + 2 * var(--gut));margin-inline:auto;
  padding-left:max(16px,var(--gut),env(safe-area-inset-left,0px));
  padding-right:max(16px,var(--gut),env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- type ---------- */
h1,h2,h3,h4{font-family:var(--d);font-weight:400;color:var(--ink);margin:0;text-wrap:balance;font-optical-sizing:auto}
.h1{font-size:clamp(40px,6vw,76px);line-height:1.04;letter-spacing:-.04em}
.h2{font-size:clamp(32px,4.1vw,54px);line-height:1.08;letter-spacing:-.032em}
.h2s{font-size:clamp(28px,3.2vw,42px);line-height:1.12;letter-spacing:-.03em}
.h3{font-size:clamp(26px,2.5vw,34px);line-height:1.12;letter-spacing:-.025em}
.h3s{font-size:clamp(24px,2.2vw,31px);line-height:1.15;letter-spacing:-.026em}
.h4{font-size:clamp(20px,1.6vw,23px);line-height:1.25;letter-spacing:-.018em}
p{margin:0;text-wrap:pretty}
.lede{font-size:clamp(17px,1.35vw,19.5px);line-height:1.55;color:var(--muted);max-width:58ch}
.dark h1,.dark h2,.dark h3,.dark h4{color:var(--on-dark)}
.dark .lede{color:var(--on-dark-2)}
.nw{white-space:nowrap}
.hl{color:var(--ink);background-image:linear-gradient(transparent 60%,var(--lime) 60%,var(--lime) 93%,transparent 93%);
  -webkit-box-decoration-break:clone;box-decoration-break:clone}

/* ---------- chip, button, marker ---------- */
.chip{display:inline-flex;align-items:center;gap:8px;min-height:30px;padding:5px 12px 5px 10px;border:1px solid var(--ink);border-radius:8px;
  font:500 12.5px/1.2 var(--d);letter-spacing:.01em;color:var(--ink);white-space:nowrap}
.chip::before{content:"";flex:none;width:8px;height:8px;border-radius:2px;background:var(--ink)}
.chip.lime{background:var(--lime)}
.chip.soft{border-color:var(--line-2);color:var(--text);background:var(--paper)}
.chip.soft::before{background:var(--faint)}
.dark .chip{border-color:rgba(243,243,240,.38);color:var(--on-dark)}
.dark .chip::before{background:var(--lime)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 20px;border-radius:10px;
  border:1.5px solid var(--ink);font:500 15px/1 var(--d);letter-spacing:.003em;text-decoration:none;white-space:nowrap;cursor:pointer;
  transition:background .2s,color .2s,border-color .2s}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:var(--ink-3);border-color:var(--ink-3)}
.btn.line{background:transparent;color:var(--ink)}
.btn.line:hover{background:var(--ink);color:var(--paper)}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.lime:hover{background:var(--lime-2)}
.btn.sm{height:40px;padding:0 16px;font-size:14px}
.ar{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
.btn:hover .ar:not(.ne):not(.ic){transform:translateX(3px)}
.btn:hover .ar.ne{transform:translate(2px,-2px)}

.mk{position:relative;display:inline-block;white-space:nowrap;isolation:isolate}
.mk>svg{position:absolute;left:-4%;bottom:-.13em;width:108%;height:.36em;z-index:-1;overflow:visible;pointer-events:none;
  clip-path:inset(-30% -3% -30% -3%);transition:clip-path 1s var(--ease) .12s}
html.js .mk:not(.in)>svg{clip-path:inset(-30% 103% -30% -3%)}
.mk path{fill:none;stroke:var(--lime);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.mk .m1{stroke-width:.15em}
.mk .m2{stroke-width:.07em}

/* ---------- check grid and dot grid ---------- */
.gridbg{position:relative;isolation:isolate}
.gridbg::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:64px 64px;background-position:calc(50% + 32px) -1px;
  -webkit-mask-image:radial-gradient(ellipse 78% 82% at 50% 18%,#000 34%,transparent 82%);
  mask-image:radial-gradient(ellipse 78% 82% at 50% 18%,#000 34%,transparent 82%)}
.gridbg.g-mid::before{-webkit-mask-image:radial-gradient(ellipse 62% 74% at 50% 50%,#000 28%,transparent 86%);
  mask-image:radial-gradient(ellipse 62% 74% at 50% 50%,#000 28%,transparent 86%)}
.gridbg.g-top::before{-webkit-mask-image:linear-gradient(#000 0%,rgba(0,0,0,.85) 30%,transparent 78%);
  mask-image:linear-gradient(#000 0%,rgba(0,0,0,.85) 30%,transparent 78%)}
.dots{background-color:var(--paper-3);background-image:radial-gradient(var(--dots) 1px,transparent 1.3px);background-size:16px 16px;background-position:-1px -1px}
.dark{background-color:var(--ink);background-image:radial-gradient(rgba(255,255,255,.1) 1px,transparent 1.3px);background-size:16px 16px;color:var(--on-dark)}

/* ---------- ribbon and nav ---------- */
.ribbon{display:block;background:var(--lime);color:var(--ink);text-decoration:none;font:500 14px/1.35 var(--d);text-align:center;padding-block:10px}
.ribbon .wrap{display:flex;justify-content:center;align-items:center;gap:6px 10px;flex-wrap:wrap}
.ribbon u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.ribbon:hover u{text-decoration-thickness:2px}
.ribbon:hover .ar{transform:translateX(3px)}
.ribbon .short{display:none}
@media(max-width:640px){.ribbon .long{display:none}.ribbon .short{display:inline}}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:rgba(254,254,254,.88);
  -webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid transparent;transition:border-color .25s}
.nav.stuck{border-bottom-color:var(--line)}
.nav-in{height:var(--navh);display:flex;align-items:center;gap:20px}
.brand{margin-right:auto;text-decoration:none;font:500 19px/1 var(--d);letter-spacing:-.03em;color:var(--ink);white-space:nowrap}
/* touch targets: padding grows the tap area, the matching negative margin keeps the layout where it was */
.brand{padding-block:12px;margin-block:-12px}
.nav-links{display:flex;align-items:center;gap:30px}
.nav-links a{position:relative;font:450 15px/1 var(--d);color:var(--ink);text-decoration:none;padding-block:8px}
.nav-links a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ink);
  transform:scaleX(0);transform-origin:left center;transition:transform .22s ease-in-out}
.nav-links a:hover::after,.nav-links a[aria-current="page"]::after{transform:scaleX(1)}
.nav-cta{display:flex;align-items:center;gap:10px;margin-left:12px}
.nav .btn{height:42px;padding:0 16px;font-size:14.5px}
.menu-btn{display:none;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:42px;height:42px;border:1.5px solid var(--ink);border-radius:10px;background:transparent;cursor:pointer;padding:0}
.menu-btn span[aria-hidden]{display:block;width:16px;height:1.5px;background:var(--ink);transition:transform .35s var(--ease)}
.menu-btn[aria-expanded="true"] span:nth-child(2){transform:translateY(3.25px) rotate(45deg)}
.menu-btn[aria-expanded="true"] span:nth-child(3){transform:translateY(-3.25px) rotate(-45deg)}
.mnav{position:absolute;left:0;right:0;top:100%;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 30px 40px -30px rgba(15,15,15,.28)}
.mnav .wrap{padding-block:6px 22px}
.mnav a{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);
  font:400 26px/1.1 var(--d);letter-spacing:-.03em;color:var(--ink);text-decoration:none}
.mnav a .ar{width:18px;height:18px}
@media(max-width:700px){
  .nav-links{display:none}
  .menu-btn{display:flex}
  .nav-cta{margin-left:0}
}
@media(min-width:701px){.mnav{display:none!important}}
@media(max-width:420px){.nav-in{gap:12px}.brand{font-size:17px}.nav-cta .btn.solid{padding:0 14px}.nav-cta .btn.solid .ar{display:none}}
@media(max-width:340px){.nav-cta .btn.solid{display:none}}

/* ---------- hero ---------- */
.hero{padding-block:clamp(144px,18vw,280px) clamp(96px,12vw,176px);text-align:center}
.hero.gridbg::before{-webkit-mask-image:radial-gradient(ellipse 72% 90% at 50% 42%,#000 30%,transparent 84%);
  mask-image:radial-gradient(ellipse 72% 90% at 50% 42%,#000 30%,transparent 84%)}
.hero-in{display:flex;flex-direction:column;align-items:center}
.hero .h1{font-size:clamp(42px,6.4vw,88px);max-width:18ch}
.hero .lede{margin-top:26px;max-width:60ch}
.hero + .sec{padding-top:clamp(56px,7vw,104px)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.tlink{display:inline-flex;align-items:center;gap:5px;color:var(--ink);text-decoration:none;white-space:nowrap}
.tlink>span{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.tlink .ar{width:.95em;height:.95em}
.tlink:hover>span{text-decoration-thickness:2px}
.tlink:hover .ar:not(.ne){transform:translateX(3px)}
.tlink:hover .ar.ne{transform:translate(2px,-2px)}
.totop{display:inline-flex;align-items:center;gap:6px}
.totop .ar{width:14px;height:14px}
.totop:hover .ar{transform:translateY(-3px)}
.rise{animation:rise .95s var(--ease) both;animation-delay:var(--delay,0s)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.bar{display:flex;align-items:center;gap:6px;height:26px;padding-left:12px;background:var(--chrome);border-bottom:1px solid var(--line)}
.bar i{width:8px;height:8px;border-radius:50%;background:var(--chrome-dot)}

/* ---------- stats (About page) ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:clamp(40px,5vw,64px);border-block:1px solid var(--line);text-align:left}
.stat{padding:26px clamp(16px,2vw,28px);border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0;padding-left:0}
.stat b{display:block;font:400 clamp(38px,4vw,54px)/1 var(--d);letter-spacing:-.045em;color:var(--ink);font-variant-numeric:lining-nums}
.stat>span{display:block;margin-top:10px;font-size:15px;line-height:1.4;color:var(--muted)}
@media(max-width:760px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-left:0;padding-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
}

/* ---------- section heads ---------- */
.sec{padding-top:var(--sec)}
.shead{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:880px;margin-inline:auto}
.shead.left{align-items:flex-start;text-align:left;margin-inline:0}
.shead h2{max-width:20ch}

/* ---------- stacked work cards ---------- */
.pile{display:grid;gap:clamp(16px,2vw,28px);margin-top:clamp(40px,5vw,64px)}
.scard{--k:0;position:relative;display:grid;grid-template-columns:minmax(0,43fr) minmax(0,57fr);min-height:500px;border-radius:var(--r-lg);
  background:var(--paper-2);border:1px solid var(--line);overflow:hidden;text-decoration:none;color:var(--text);isolation:isolate;
  transform-origin:50% 0;transform:scale(calc(1 - min(var(--k),3) * .035))}
.scard::after{content:"";position:absolute;inset:0;z-index:5;background:var(--ink);opacity:calc(min(var(--k),3) * .03);pointer-events:none}
@media(min-width:901px) and (min-height:660px){
  .pile>.scard{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh) + 20px + var(--i,0) * 14px);height:min(540px,calc(100vh - var(--navh) - 76px))}
}
.scard .txt{display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:clamp(26px,3.4vw,48px);min-width:0}
.t-top{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.scard h3{font-size:clamp(26px,2.6vw,36px);line-height:1.12;letter-spacing:-.028em;max-width:20ch}
.desc{font-size:16.5px;line-height:1.6;color:var(--muted);max-width:44ch}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px;margin:0;padding-top:18px;border-top:1px solid var(--line);width:100%}
.facts>div{min-width:0}
.facts dt{font:500 12px/1.3 var(--d);letter-spacing:.02em;color:var(--muted)}
.facts dd{margin:4px 0 0;font:500 14.5px/1.35 var(--b);color:var(--ink)}
@media(max-width:560px){
  .facts{grid-template-columns:1fr;gap:8px}
  .facts>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
  .facts dd{margin:0;text-align:right}
}
.go-ar{position:absolute;top:18px;right:18px;z-index:6;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:var(--white);border:1px solid var(--line);color:var(--ink);box-shadow:var(--shadow);transition:background .25s,border-color .25s}
.go-ar .ar{width:18px;height:18px;transform:rotate(-45deg);transition:transform .45s var(--ease)}
.scard:hover .go-ar,.mcard:hover .go-ar{background:var(--lime);border-color:var(--ink)}
.scard:hover .go-ar .ar,.mcard:hover .go-ar .ar{transform:rotate(0)}

.vis{--mx:0;--my:0;position:relative;overflow:hidden;min-height:260px;border-left:1px solid var(--line);
  background-color:var(--paper-3);background-image:radial-gradient(var(--dots) 1px,transparent 1.3px);background-size:16px 16px;background-position:-1px -1px}
.vis .main{position:absolute;left:9%;top:11%;width:104%;border-radius:12px;overflow:hidden;background:var(--white);border:1px solid var(--line);
  box-shadow:var(--shadow-lg);transform:translate3d(calc(var(--mx) * -14px),calc(var(--my) * -10px),0);transition:transform .8s var(--ease)}
.vis .main img{width:100%}
.vis .float{position:absolute;left:5%;bottom:7%;width:var(--fw,30%);border-radius:12px;overflow:hidden;background:var(--white);border:1px solid var(--line);
  box-shadow:0 30px 60px -24px rgba(15,15,15,.45);transform:translate3d(calc(var(--mx) * 22px),calc(var(--my) * 16px),0) rotate(-2deg);transition:transform .8s var(--ease)}
.vis .float img{width:100%}
.vis.phones .ph{position:absolute;top:12%;width:28%;border-radius:24px;overflow:hidden;border:5px solid var(--ink);background:var(--ink);
  box-shadow:0 30px 60px -26px rgba(15,15,15,.5);transition:transform .8s var(--ease)}
.vis.phones .ph img{width:100%;border-radius:19px}
.vis.phones .p0{left:8%;top:19%;transform:translate3d(calc(var(--mx) * -10px),calc(var(--my) * -8px),0) rotate(-6deg)}
.vis.phones .p1{left:36%;top:9%;z-index:2;transform:translate3d(calc(var(--mx) * 16px),calc(var(--my) * 12px),0)}
.vis.phones .p2{left:64%;top:19%;transform:translate3d(calc(var(--mx) * -10px),calc(var(--my) * -8px),0) rotate(6deg)}
@media(max-width:900px){
  .scard{grid-template-columns:1fr;min-height:0;transform:none}
  .scard::after{display:none}
  .scard .vis{order:-1;aspect-ratio:16/11;border-left:0;border-bottom:1px solid var(--line)}
}
.more{display:flex;justify-content:center;margin-top:clamp(28px,3vw,40px)}

/* smaller project cards on the Work page */
.mcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2vw,24px);margin-top:clamp(28px,3vw,40px)}
.mcard{position:relative;display:flex;flex-direction:column;min-width:0;border-radius:var(--r-lg);background:var(--paper-2);border:1px solid var(--line);overflow:hidden;
  text-decoration:none;color:var(--text);transition:border-color .2s}
.mcard:hover{border-color:var(--ink)}
.mthumb{display:block;aspect-ratio:16/9;overflow:hidden;border-bottom:1px solid var(--line);background:var(--paper-3)}
.mthumb img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .7s var(--ease)}
.mcard:hover .mthumb img{transform:scale(1.03)}
.mb{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:22px 24px 24px}
.mcard h3{font-size:clamp(21px,1.8vw,25px);line-height:1.2;letter-spacing:-.02em}
.mcard .facts{margin-top:auto}
.mcard{container-type:inline-size}
@container (max-width:420px){
  .mcard .facts{grid-template-columns:1fr;gap:8px}
  .mcard .facts>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
  .mcard .facts dd{margin:0;text-align:right}
}
@media(max-width:700px){.mcards{grid-template-columns:1fr}}

/* ---------- services: dark band, one row per service ---------- */
.band{margin-top:var(--sec);padding-block:var(--sec)}
.acc{--acc-ic:clamp(40px,4vw,52px);list-style:none;margin:clamp(40px,5vw,64px) 0 0;padding:0;border-top:1px solid var(--ink-3)}
.acc-i{border-bottom:1px solid var(--ink-3)}
.acc-i h3{margin:0;font:inherit;letter-spacing:inherit}
.acc-b{width:100%;display:grid;grid-template-columns:var(--acc-ic) minmax(0,1fr);align-items:center;padding:clamp(20px,2vw,26px) 0;
  background:none;border:0;color:var(--on-dark);cursor:pointer;text-align:left}
.acc-b>.ar{justify-self:start;width:clamp(20px,1.8vw,24px);height:clamp(20px,1.8vw,24px);color:var(--on-dark-2);stroke-width:1.5;
  transform:rotate(-45deg);transition:transform .45s var(--ease),color .25s}
.acc-b:hover>.ar{color:var(--on-dark);transform:rotate(-45deg) translateX(3px)}
.acc-i.open .acc-b>.ar{color:var(--lime);transform:rotate(0)}
.acc-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-width:0}
.acc-t{font:400 clamp(26px,2.5vw,34px)/1.12 var(--d);letter-spacing:-.025em}
.acc-p{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.acc-i.open .acc-p{grid-template-rows:1fr}
.acc-p>div{overflow:hidden;min-height:0}
.acc-i:not(.open) .acc-p>div{visibility:hidden;transition:visibility 0s linear .5s}
.acc-in{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:0 0 clamp(24px,2.6vw,32px) var(--acc-ic)}
.acc-in p{font-size:16.5px;line-height:1.65;color:var(--on-dark-2);max-width:62ch}
.pills{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pills li{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:7px;background:var(--pill);border:1px solid var(--ink-3);
  font:500 12.5px/1.25 var(--d);color:var(--on-dark)}
.pills li::before{content:"";flex:none;width:6px;height:6px;border-radius:2px;background:var(--lime)}

/* ---------- process: four connected steps on the light grid ---------- */
.pflow{--pgap:clamp(14px,1.6vw,22px);list-style:none;margin:clamp(40px,5vw,64px) 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--pgap)}
.pf{display:flex;flex-direction:column;min-width:0}
.pf-h{display:flex;align-items:center;gap:12px;container-type:inline-size}
.pf-num{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow);
  font:500 15px/1 var(--d);color:var(--ink);transition:background .25s,border-color .25s}
.pf:hover .pf-num{background:var(--lime);border-color:var(--ink)}
.pf-card{flex:1;display:flex;flex-direction:column;gap:12px;padding:24px 24px 0;border-radius:var(--r-lg);background:var(--paper-2);border:1px solid var(--line);overflow:hidden;
  transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .3s}
.pf:hover .pf-card{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--ink)}
/* the longest title ("Deliver & Learn") stays on one line: below ~1390px wide the four titles shrink together to fit the card, so the cards stay aligned */
.pf-t{font-size:clamp(22px,2vw,26px);font-size:min(clamp(22px,2vw,26px),calc((100cqi - 56px) / 6.9));line-height:1.2;letter-spacing:-.022em}
.pf-card>p{font-size:15.5px;line-height:1.6;color:var(--muted)}
.pf-gl{margin-top:2px;font:500 12px/1.2 var(--d)!important;letter-spacing:.02em;color:var(--ink)!important}
.pf-get{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pf-get li{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:7px;background:var(--white);border:1px solid var(--line);font:500 12.5px/1.25 var(--d);color:var(--text)}
.pf-get li::before{content:"";flex:none;width:6px;height:6px;border-radius:2px;background:var(--lime);box-shadow:0 0 0 1px var(--ink)}
.pf-vis{position:relative;margin:auto -24px 0;aspect-ratio:16/11;border-top:1px solid var(--line);overflow:hidden;
  background-color:var(--paper-3);background-image:radial-gradient(var(--dots) 1px,transparent 1.3px);background-size:16px 16px;background-position:-1px -1px}
.pfx{position:absolute;display:block;border-radius:10px;overflow:hidden;background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .6s var(--ease)}
.pfx img,.pfx svg{display:block;width:100%;height:auto}
.pfx>b{display:flex;align-items:center;gap:6px;padding:6px 9px;border-bottom:1px solid var(--line);font:500 10.5px/1 var(--d);color:var(--muted)}
.pfx>b::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--ink)}
.pfx-final>b::before{background:var(--lime);box-shadow:0 0 0 1px var(--ink)}
.pfx-audit{left:8%;top:13%;width:100%}
.pfx-audit .shot{position:relative;display:block}
.pfx-audit .pin{width:20px;height:20px;margin:-10px 0 0 -10px;font-size:10px}
.pf:hover .pfx-audit{transform:translateY(-6px)}
.pfx-plan{left:8%;right:8%;top:12%;padding:4px 14px;transform:rotate(-2deg)}
.pfx-plan .hy{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.pfx-plan .hy:last-child{border-bottom:0}
.pfx-plan .hy span{font:400 12.5px/1.35 var(--d);color:var(--ink)}
.pfx-plan .hy em{justify-self:start;font:500 10.5px/1.2 var(--d);font-style:normal;padding:3px 7px;border-radius:5px;background:var(--lime);color:var(--ink)}
.pf:hover .pfx-plan{transform:rotate(0) translateY(-4px)}
.pfx-wire{left:7%;top:11%;width:74%;transform:rotate(-4deg)}
.pfx-final{right:6%;top:44%;width:74%;transform:rotate(2deg)}
.pf:hover .pfx-wire{transform:rotate(-6deg) translate(-4px,-4px)}
.pf:hover .pfx-final{transform:rotate(0) translateY(-6px)}
.pfx-hand{left:6%;top:9%;width:74%;transform:rotate(-3deg)}
.pfx-learn{right:5%;bottom:9%;width:62%;transform:rotate(2deg)}
.pfx-learn>b::before{background:var(--lime);box-shadow:0 0 0 1px var(--ink)}
.pfx-learn .mp{display:grid;padding:1px 10px}
.pfx-learn .mr{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid var(--line);font:400 11.5px/1.25 var(--d);color:var(--ink)}
.pfx-learn .mr:last-child{border-bottom:0}
.pfx-learn .mr i{flex:none;width:9px;height:9px;border-radius:2.5px;border:1px solid var(--ink);background:var(--white)}
.pfx-learn .mr span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf:hover .pfx-hand{transform:rotate(-5deg) translate(-4px,-4px)}
.pf:hover .pfx-learn{transform:rotate(0) translateY(-6px)}
.pin{position:absolute;z-index:2;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--lime);border:1.5px solid var(--ink);
  display:grid;place-items:center;font:600 11px/1 var(--d);font-style:normal;color:var(--ink);box-shadow:0 0 0 4px rgba(220,250,55,.45)}
@media(max-width:1100px){
  .pflow{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:640px){.pflow{grid-template-columns:1fr}}

/* ---------- testimonials: one centred quote on the check grid, as on uxfol.io ----------
   lime quote mark, a 26px quote at most 680px wide, then the author on the left and the company logo
   on the right, across the same 680px */
.tst{display:flex;flex-direction:column;align-items:center;gap:40px;padding:96px max(16px,var(--gut));text-align:center}
.qmark{display:block;width:50px;height:44px;margin:0}
.qmark path{fill:var(--lime);stroke:none}
/* the section tag sits a little closer to the quote mark than the 40px between the other parts */
.tst>.chip{margin-bottom:-12px}
.tslides{display:grid;width:min(680px,100%)}
/* the old quote fades out first, then the new one rises in, so the two never overlap */
.tslide{grid-area:1/1;margin:0;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .22s ease-in,transform .22s ease-in,visibility 0s linear .22s}
.tslide.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s var(--ease) .2s,transform .6s var(--ease) .2s,visibility 0s}
.tslide:not(.on){pointer-events:none}
.tq{margin:0;font:400 clamp(23px,1.85vw,26px)/1.3 var(--d);letter-spacing:-.02em;color:var(--ink);text-wrap:balance}
.tq.ph{color:var(--muted)}
.tq.long{font-size:clamp(19px,1.45vw,21px);line-height:1.38}
.tslide{align-self:center}
.tperson{display:flex;align-items:center;justify-content:space-between;gap:32px;margin-top:40px;text-align:left}
.who{flex:1 1 auto;display:flex;align-items:center;gap:16px;min-width:0}
.who img,.av{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
.av{display:grid;place-items:center;background:var(--paper-3);border:1px dashed var(--faint);color:var(--faint)}
.av svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5}
.av.ini{border:1px solid var(--line-2);color:var(--ink);font:500 15px/1 var(--d);letter-spacing:.02em}
.who b{display:block;font:400 18px/1.2 var(--d);letter-spacing:-.02em;color:var(--ink)}
.who small{display:block;margin-top:2px;font:400 14px/1.4 var(--b);letter-spacing:-.01em;color:var(--muted)}
.tlogo{display:block;width:132px;height:40px;object-fit:contain;object-position:right center;filter:grayscale(1);opacity:.72}
.tlogo.ph{display:inline-grid;place-items:center;height:40px;padding:0 14px;border:1px dashed var(--faint);border-radius:8px;font:500 13px/1 var(--d);color:var(--muted)}
/* slider controls: round arrows like the work cards', and one progress bar per quote that fills, then moves on */
.tnav{display:flex;justify-content:center;align-items:center;gap:20px;max-width:100%}
.tarrow{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--white);color:var(--ink);box-shadow:var(--shadow);
  display:grid;place-items:center;cursor:pointer;padding:0;transition:background .25s,border-color .25s}
.tarrow .ar{width:18px;height:18px}
.tarrow.prev .ar{transform:rotate(180deg)}
.tarrow:hover{background:var(--lime);border-color:var(--ink)}
.tarrow.next:hover .ar{transform:translateX(2px)}
.tarrow.prev:hover .ar{transform:rotate(180deg) translateX(2px)}
.tprog{display:flex;align-items:center;gap:8px;min-width:0}
.tseg{position:relative;width:56px;flex:0 1 auto;min-width:18px;height:24px;padding:0;border:0;background:none;cursor:pointer}
.tseg::before,.tseg i{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;border-radius:2px}
.tseg::before{background:var(--line-2)}
.tseg i{background:var(--ink);transform:scaleX(0);transform-origin:left center}
.tseg.done i{transform:scaleX(1)}
.tseg.on i{animation:tfill var(--tdur,8s) linear forwards}
.tst.paused .tseg.on i{animation-play-state:paused}
.tst.static .tseg.on i{animation:none;transform:scaleX(1)}
@keyframes tfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(max-width:420px){.tnav{gap:14px}.tseg{width:40px}}
/* on phones the author and the logo stay on one row, as on uxfol.io: the role wraps and the logo shrinks */
@media(max-width:560px){.tperson{gap:16px}.who{gap:12px}.tlogo{width:96px;height:32px}}
@media(max-width:640px){.tst{padding-block:64px}}
.tst.after-intro{padding-bottom:0}

/* ---------- about snapshot ---------- */
.me-band{margin-top:var(--sec);padding-block:var(--sec) 0;background:linear-gradient(to bottom,#EEEEEE,#FFFFFF)}
/* in the About band the grid is drawn a shade darker, so it shows on the grey */
.tst.in-band{padding-inline:0;padding-top:clamp(80px,9vw,128px)}
.me{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(40px,6vw,96px);align-items:center}
.me-ph{position:relative;margin:0}
.me-ph img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r-lg);background:var(--paper-3)}
.badge{position:absolute;top:-26px;right:-26px;width:124px;height:124px;border-radius:50%;display:block;text-decoration:none}
.badge svg{width:100%;height:100%;overflow:visible}
.b-bg{fill:var(--lime);stroke:var(--ink);stroke-width:1.5}
.b-txt{font-family:var(--d);font-size:9.4px;font-weight:600;letter-spacing:.14em;fill:var(--ink)}
.b-rot{transform-origin:60px 60px;transform:rotate(-18deg)}
.b-in{fill:var(--ink)}
.b-ck{fill:none;stroke:var(--lime);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.me-txt{display:flex;flex-direction:column;align-items:flex-start;gap:18px;min-width:0}
.me-txt>p{font-size:17.5px;line-height:1.65;color:var(--text);max-width:56ch}
.me .ctas{margin-top:12px}
@media(max-width:900px){.me{grid-template-columns:1fr}.me-ph{max-width:400px;margin-right:24px}.badge{right:-20px;width:108px;height:108px}}

/* ---------- FAQ ---------- */
.faq{padding-block:var(--sec)}
.faq-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,6vw,96px);align-items:start}
.faq-l{display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.faq-l .lede{max-width:36ch}
@media(min-width:901px){.faq-l{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh) + 40px)}}
.qa-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-2)}
.qa{border-bottom:1px solid var(--line-2)}
.qa h3{margin:0;font:inherit;letter-spacing:inherit}
.qa button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 0;background:none;border:0;cursor:pointer;
  text-align:left;font:400 clamp(18px,1.6vw,21px)/1.35 var(--d);letter-spacing:-.015em;color:var(--ink)}
.pm{flex:none;width:28px;height:28px;display:grid;place-items:center;color:var(--ink)}
.pm svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.pm .pm-v{transform-box:fill-box;transform-origin:50% 50%;transition:transform .4s var(--ease)}
.qa.open .pm .pm-v{transform:rotate(90deg)}
.ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.qa.open .ans{grid-template-rows:1fr}
.ans>div{overflow:hidden;min-height:0}
.qa:not(.open) .ans>div{visibility:hidden;transition:visibility 0s linear .45s}
.ans p{padding:0 58px 24px 0;font-size:16.5px;line-height:1.65;color:var(--muted)}
@media(max-width:900px){.faq-grid{grid-template-columns:1fr}.ans p{padding-right:0}}

/* ---------- closing CTA ---------- */
.cta{padding-top:var(--sec);text-align:center;overflow-x:clip}
.cta-in{display:flex;flex-direction:column;align-items:center;gap:20px}
.cta h2{max-width:16ch}
.cta .ctas{justify-content:center;margin-top:8px}
.mailrow{display:flex;align-items:center;justify-content:center;gap:10px 14px;flex-wrap:wrap}
.mail{font:400 clamp(20px,2vw,24px)/1.2 var(--d);letter-spacing:-.02em;color:var(--ink);-webkit-user-select:all;user-select:all}
.copied{font:500 13px/1 var(--d);padding:7px 10px;border-radius:7px;background:var(--lime);color:var(--ink)}
.small{font-size:14.5px;color:var(--muted)}
.limeline{height:8px;background:var(--lime);margin-top:var(--sec)}

/* ---------- footer ---------- */
.foot{padding-block:24px 28px}
.f-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;font-size:14px;color:var(--muted)}
.f-links{display:flex;flex-wrap:wrap;gap:6px 22px}
.f-links a,.totop{padding-block:10px;margin-block:-10px}
.f-links a{padding-inline:11px;margin-inline:-11px}
.f-row a{color:var(--muted);text-decoration:none;transition:color .2s}
.f-row a:hover{color:var(--ink)}
@media(max-width:640px){.f-row{flex-direction:column;align-items:flex-start;row-gap:20px}}

/* ---------- page heroes ---------- */
.phero{padding-block:clamp(56px,7vw,104px) clamp(24px,3vw,40px)}
.phero-in{display:flex;flex-direction:column;align-items:flex-start;gap:22px}
.phero h1{max-width:15ch}
.ah{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(40px,6vw,96px);align-items:center}
.ah .ctas{margin-top:8px}
.ah .me-ph{max-width:440px;justify-self:end;width:100%}
@media(max-width:900px){.ah{grid-template-columns:1fr}.ah .me-ph{justify-self:start;max-width:380px;width:calc(100% - 24px);margin-right:24px}}
.xp{list-style:none;margin:clamp(32px,4vw,48px) 0 0;padding:0;border-top:1px solid var(--line)}
.xp li{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:8px 24px;padding:26px 0;border-bottom:1px solid var(--line);align-items:baseline}
.xp .yr{font:500 13.5px/1.3 var(--d);letter-spacing:.01em;color:var(--muted);display:flex;align-items:center;gap:10px}
.xp .yr i{width:8px;height:8px;border-radius:2px;background:var(--line-2)}
.xp li.now .yr i{background:var(--lime);box-shadow:0 0 0 1px var(--ink)}
.xp h3{font-size:clamp(22px,2vw,28px);line-height:1.2;letter-spacing:-.024em}
.xp p{margin-top:6px;font-size:16.5px;color:var(--muted);max-width:60ch}
@media(max-width:640px){.xp li{grid-template-columns:1fr}}
.cert{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,4vw,64px);align-items:center;padding:clamp(24px,4vw,56px);
  border-radius:var(--r-lg);background:var(--paper-2);border:1px solid var(--line)}
.cert-t{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.cert-t p{font-size:16.5px;color:var(--muted)}
.cert .plate .mat{padding:clamp(16px,3vw,36px)}
@media(max-width:900px){.cert{grid-template-columns:1fr}}
.princ{list-style:none;margin:clamp(32px,4vw,48px) 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,1.6vw,24px)}
.princ li{display:flex;flex-direction:column;gap:10px;padding:clamp(22px,2.6vw,32px);border-radius:var(--r-lg);background:var(--paper-2);border:1px solid var(--line)}
.princ li::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--lime);box-shadow:0 0 0 1px var(--ink);margin-bottom:6px}
.princ p{font-size:16px;color:var(--muted)}
@media(max-width:700px){.princ{grid-template-columns:1fr}}

/* ---------- case study ---------- */
.cs-hero{padding-top:clamp(32px,4vw,56px)}
/* the check background covers the top half of the case-study header */
.cs-hero.gridbg::before{bottom:50%}
.back{display:inline-flex;align-items:center;gap:8px;font:450 14.5px/1 var(--d);color:var(--muted);text-decoration:none;padding-block:6px}
.back:hover{color:var(--ink)}
.back:hover .ar{transform:translateX(-3px)}
.cs-hero h1{margin-top:clamp(24px,3vw,36px);max-width:16ch}
.deck{margin-top:18px;max-width:42ch;font:400 clamp(20px,1.9vw,26px)/1.36 var(--d);letter-spacing:-.018em;color:var(--text)}
/* project overview: product, problem, role and status, two by two */
.ovw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ovw>div{padding:18px 20px 20px;border-radius:var(--r-md);background:var(--paper);border:1px solid var(--line);min-width:0}
.ovw b{display:flex;align-items:center;gap:8px;font:500 12.5px/1.2 var(--d);letter-spacing:.02em;color:var(--ink)}
.ovw b::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--ink)}
.ovw .st b::before{background:var(--lime);box-shadow:0 0 0 1px var(--ink)}
.ovw p{margin-top:8px;font-size:15.5px;line-height:1.55;color:var(--text)}
.ovw p strong{font-weight:500;color:var(--ink)}
@media(max-width:640px){.ovw{grid-template-columns:1fr}}
/* jump belt: a full-width bar under the hero that sticks below the header once reached;
   its links are set like the header's, with the same 2px underline on hover and for the section in view */
.jump{--belth:52px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh) + 1px);z-index:55;margin-top:clamp(36px,4.4vw,56px);
  background:rgba(254,254,254,.88);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px);
  border-block:1px solid var(--line)}
.jump-in{position:relative;display:flex;align-items:center;gap:30px;height:var(--belth);overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
.jump-in::-webkit-scrollbar{display:none}
.jump .jl{flex:none;font:450 15px/1 var(--d);color:var(--muted)}
.jump a{position:relative;flex:none;font:450 15px/1 var(--d);color:var(--ink);text-decoration:none;white-space:nowrap;padding-block:8px}
.jump a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ink);
  transform:scaleX(0);transform-origin:left center;transition:transform .22s ease-in-out}
.jump a:hover::after,.jump a[aria-current="true"]::after{transform:scaleX(1)}
@media(max-width:640px){.jump .jl{display:none}.jump-in{gap:24px}}
@media(max-width:900px){.jump-in{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 16px,#000 calc(100% - 28px),transparent 100%);
  mask-image:linear-gradient(to right,transparent 0,#000 16px,#000 calc(100% - 28px),transparent 100%)}}
/* while the belt is stuck, header and belt read as one bar with one hairline */
.nav.belted{border-bottom-color:transparent}
.cover{margin-top:clamp(28px,3.4vw,44px)}
.cap{display:flex;gap:9px;align-items:baseline;margin-top:12px;font-size:14px;line-height:1.45;color:var(--muted)}
.cap::before{content:"";flex:none;width:7px;height:7px;border-radius:2px;background:var(--lime);box-shadow:0 0 0 1px var(--ink);transform:translateY(-1px)}
.snap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:clamp(24px,3vw,36px) 0 0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper-2);overflow:hidden}
.snap>div{padding:18px 20px;border-left:1px solid var(--line);min-width:0}
.snap>div:first-child{border-left:0}
.snap dt{font:500 12.5px/1.3 var(--d);letter-spacing:.02em;color:var(--muted)}
.snap dd{margin:6px 0 0;font-size:15px;line-height:1.45;color:var(--ink)}
.snap dd .tlink{padding-block:10px;margin-block:-10px}
@media(max-width:900px){
  .snap{grid-template-columns:repeat(2,minmax(0,1fr))}
  .snap>div{border-left:0;border-top:1px solid var(--line)}
  .snap>div:nth-child(-n+2){border-top:0}
  .snap>div:nth-child(even){border-left:1px solid var(--line)}
}
@media(max-width:460px){
  .snap{grid-template-columns:1fr}
  .snap>div:nth-child(even){border-left:0}
  .snap>div:nth-child(2){border-top:1px solid var(--line)}
}
.it{white-space:nowrap}
.sx.eol{color:transparent}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px}
.c-lbl{grid-column:1/span 3;padding-top:.55em}
.c-main{grid-column:4/-1}
.c-text{grid-column:4/span 7}
.c-full{grid-column:1/-1}
@media(max-width:900px){.g{column-gap:0}.g>*{grid-column:1/-1!important}.c-lbl{padding-top:0;margin-bottom:16px}}
.cs-sec{padding-top:var(--sec)}
.cs-sec .content{margin-top:28px}
.body p{font-size:18px;line-height:1.65;color:var(--text)}
.body p+p{margin-top:16px}
.body p.ask{font:400 clamp(21px,1.9vw,26px)/1.36 var(--d);letter-spacing:-.018em;color:var(--ink)}
.role-card{margin-top:32px;padding:24px 26px;border-radius:var(--r-md);background:var(--paper-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.role-card p{font-size:16.5px;line-height:1.6;color:var(--text)}
.rows{list-style:none;margin:32px 0 0;padding:0;border-top:1px solid var(--line)}
.rows li{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,6fr);gap:6px 24px;padding:20px 0;border-bottom:1px solid var(--line);align-items:baseline}
.rows b{font:500 17px/1.3 var(--d);letter-spacing:-.01em;color:var(--ink)}
.rows p{font-size:16.5px;line-height:1.6;color:var(--muted)}
@media(max-width:640px){.rows li{grid-template-columns:1fr}}
.steps{display:grid;row-gap:clamp(64px,7vw,104px);margin-top:clamp(40px,5vw,72px)}
.step{align-items:center}
.st-txt{grid-column:1/span 5;display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-width:0}
.step .plate{grid-column:6/-1}
.step.wide .st-txt{grid-column:1/span 8}
.step.wide .plate{grid-column:1/-1;margin-top:32px}
.st-k{display:inline-flex;align-items:center;gap:10px;font:500 13px/1 var(--d);letter-spacing:.02em;color:var(--muted)}
.st-by{padding:4px 8px;border:1px solid var(--line-2);border-radius:6px;background:var(--paper);font:500 12px/1 var(--d);letter-spacing:.01em;color:var(--muted)}
.st-k b{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:8px;background:var(--lime);border:1px solid var(--ink);color:var(--ink);font-weight:500}
.st-lead{font-size:17px;line-height:1.65;color:var(--muted)}
/* each decision carries its reason, under a hairline */
.st-why{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:2px;padding-top:14px;border-top:1px solid var(--line)}
.st-why b{display:flex;align-items:center;gap:8px;font:500 12.5px/1.2 var(--d);letter-spacing:.02em;color:var(--ink)}
.st-why b::before{content:"";flex:none;width:8px;height:8px;border-radius:2px;background:var(--lime);box-shadow:0 0 0 1px var(--ink)}
.st-why p{font-size:16px;line-height:1.6;color:var(--text)}
@media(max-width:900px){.step .plate{margin-top:24px}}
.tbl{margin-top:40px;border-top:1.5px solid var(--ink)}
.tbl .tr{display:grid;grid-template-columns:var(--cols);gap:8px 24px;padding:18px 0;border-bottom:1px solid var(--line);align-items:baseline}
.tbl .th{font:500 12.5px/1.3 var(--d);letter-spacing:.02em;color:var(--muted)}
.tbl .td{font-size:15.5px;line-height:1.55;color:var(--muted);min-width:0}
.tbl .td.main{font:400 17.5px/1.4 var(--d);letter-spacing:-.012em;color:var(--ink)}
.tbl .k{font:500 13px/1 var(--d);color:var(--muted)}
.tbl .td-k{display:none}
@media(max-width:760px){.tbl .thead{display:none}.tbl .tr{grid-template-columns:1fr!important;row-gap:12px}
  .tbl .td-k{display:block;margin-bottom:3px;font:500 12.5px/1.3 var(--d);letter-spacing:.02em;color:var(--ink)}}
.after{margin-top:28px}
/* my role: what I did beside what others did */
.own{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px clamp(20px,3.2vw,44px);margin-top:36px;align-items:start}
.own-col{min-width:0}
.own-col h3{margin:0 0 10px;font:500 13px/1.2 var(--d);letter-spacing:.02em;color:var(--muted)}
.own-col ul{list-style:none;margin:0;padding:0;border-bottom:1px solid var(--line)}
.own-col li{position:relative;padding:12px 0 12px 22px;border-top:1px solid var(--line);font-size:15.5px;line-height:1.5}
.own-mine li{color:var(--ink)}
.own-mine li::before{content:"";position:absolute;left:1px;top:calc(12px + .5em);width:7px;height:7px;border-radius:2px;background:var(--lime);box-shadow:0 0 0 1px var(--ink)}
.own-other li{color:var(--muted)}
.own-other li::before{content:"";position:absolute;left:1px;top:calc(12px + .75em);width:9px;height:1.5px;border-radius:1px;background:var(--faint)}
@media(max-width:640px){.own{grid-template-columns:1fr}}
/* a part inside a section, such as Checkout or What changed */
.sub-lbl,.sub-h{margin-top:clamp(64px,7vw,104px)}
.cs-sec .sub-lbl{padding-top:.5em}
.sublbl{display:inline-flex;align-items:center;gap:10px;font:500 13px/1.2 var(--d);letter-spacing:.02em;color:var(--muted)}
.sublbl::before{content:"";flex:none;width:16px;height:1.5px;border-radius:1px;background:var(--ink)}
@media(max-width:900px){.cs-sec .sub-lbl{padding-top:0}.sub-h{margin-top:0}}
.nexthead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:var(--sec)}
.nexthead + .scard{margin-top:20px}

/* ---------- plates ---------- */
.plate{margin:0;min-width:0}
.mat{position:relative;border-radius:var(--r-lg);padding:clamp(18px,4vw,56px);border:1px solid var(--line);overflow:hidden;
  background-color:var(--paper-3);background-image:radial-gradient(var(--dots) 1px,transparent 1.3px);background-size:16px 16px;background-position:-1px -1px}
.scr{position:relative;width:100%;margin-inline:auto;background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);
  transition:transform .7s var(--ease)}
.plate:hover .scr{transform:translateY(-4px)}
.scr>img,.scr>svg{display:block;width:100%;height:auto}
.mat .stack{display:flex;flex-direction:column;align-items:center;gap:20px}
.mat .stack.row{flex-direction:row;align-items:flex-start;justify-content:center}
.mat .stack.row>.scr{flex:0 1 var(--w);width:auto;min-width:0;margin-inline:0}
@media(max-width:600px){.mat .stack.row{flex-direction:column;align-items:center}.mat .stack.row>.scr{flex:none;width:100%;margin-inline:auto}}
.mat .phones{display:flex;justify-content:center;align-items:flex-start;gap:6%}
.mat .phones .ph{flex:0 0 var(--phw,56%);min-width:0}
.mat .phones .scr{border-radius:18px}
.mat .phones.n3{justify-content:space-between;gap:0}
.mat .phones.n3 .ph{flex:0 0 28%}

/* ---------- before and after: the old store and the redesign, side by side ---------- */
.ba-list{display:grid;row-gap:clamp(56px,6vw,96px);margin-top:clamp(40px,5vw,64px)}
.ba{min-width:0}
.ba-head{display:flex;flex-direction:column;align-items:flex-start;gap:14px;max-width:820px}
.ba-mat{--bgap:clamp(20px,3.2vw,44px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px var(--bgap);align-items:start;margin-top:28px}
.ba-side{margin:0;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.ba-side .scr{transition:transform .7s var(--ease)}
.ba-side:hover .scr{transform:translateY(-4px)}
.ba-side .scr>img{aspect-ratio:1440/900;object-fit:cover;object-position:top}
.ba-notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(20px,3.2vw,44px);padding:20px clamp(18px,4vw,56px) 0}
.ba-col{display:grid;grid-template-rows:subgrid;align-content:start;min-width:0}
.ba-col h4{margin:0 0 8px;font:500 13px/1.2 var(--d);letter-spacing:.02em;color:var(--muted)}
.ba-col ul{display:grid;grid-template-rows:subgrid;list-style:none;margin:0;padding:0}
.ba-col li{position:relative;padding:10px 0 10px 22px;border-top:1px solid var(--line);font-size:15.5px;line-height:1.5}
.ba-col.ba-was li{color:var(--muted)}
.ba-col.ba-was li::before{content:"";position:absolute;left:1px;top:calc(10px + .75em);width:9px;height:1.5px;border-radius:1px;background:var(--faint)}
.ba-col.ba-now li{color:var(--ink)}
.ba-col.ba-now li::before{content:"";position:absolute;left:1px;top:calc(10px + .5em);width:7px;height:7px;border-radius:2px;background:var(--lime);box-shadow:0 0 0 1px var(--ink)}
@media(min-width:721px){.ba-col h4{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
@media(max-width:720px){
  .ba-mat{grid-template-columns:minmax(0,1fr);row-gap:28px}
  .ba-notes{grid-template-columns:minmax(0,1fr);row-gap:24px;padding:20px 0 0}
  .ba-col,.ba-col ul{grid-row:auto!important;grid-template-rows:none}
}

/* ---------- CV: two A4 sheets (794 x 1123px), scaled to fit on screen and printed at A4 ---------- */
.cv-desk{margin-top:clamp(28px,3.4vw,44px);padding-block:clamp(28px,4.4vw,64px)}
.cv-stack{display:flex;flex-direction:column;align-items:center;gap:clamp(18px,2.6vw,32px)}
.cv-fit{position:relative;width:min(794px,100%);aspect-ratio:794/1123}
.sheet{--s:1;position:absolute;left:0;top:0;width:794px;height:1123px;transform:scale(var(--s));transform-origin:0 0;
  display:flex;flex-direction:column;overflow:hidden;background:#FFFFFF;color:var(--ink);
  border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow-lg);
  font:400 13px/1.5 var(--b);letter-spacing:-.003em;text-align:left;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;page:cv}
.sheet a{color:inherit;text-decoration:none}
:where(.sheet) :is(ul,ol,dl){list-style:none;margin:0;padding:0}
:where(.sheet) dd{margin:0}
.sh-grid{position:absolute;left:0;right:0;top:0;height:420px;pointer-events:none;
  background-image:linear-gradient(to right,#ECECE8 1px,transparent 1px),linear-gradient(to bottom,#ECECE8 1px,transparent 1px);
  background-size:32px 32px;background-position:-1px -1px;
  -webkit-mask-image:linear-gradient(#000,rgba(0,0,0,.55) 55%,transparent);mask-image:linear-gradient(#000,rgba(0,0,0,.55) 55%,transparent)}
.sh-in{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;padding:44px 56px 0}
.sh-run{display:flex;justify-content:space-between;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.sh-foot{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:auto;padding:14px 0 16px;font-size:11px;color:var(--muted)}
.sh-lime{flex:none;height:8px;background:var(--lime)}
.sheet .chip{min-height:22px;padding:2px 8px 2px 7px;gap:6px;border-radius:6px;font-size:10.5px;background:#FFFFFF}
.sheet .chip::before{width:6px;height:6px;border-radius:1.5px}
.sheet .chip.lime{background:var(--lime)}
.cv-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cv-chips{display:flex;flex-wrap:wrap;gap:6px}
.cv-loc{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.cv-loc svg{width:13px;height:13px;flex:none;fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cv-name{margin-top:16px;font:400 62px/.95 var(--d);letter-spacing:-.045em;color:var(--ink)}
.cv-tag{margin-top:14px;font:400 24px/1.22 var(--d);letter-spacing:-.022em;color:var(--ink)}
.cv-lede{margin-top:10px;max-width:62ch;font-size:13.5px;line-height:1.55;color:var(--text)}
.cv-contact{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;font-size:11.5px;color:var(--text)}
.cv-contact li{display:inline-flex;align-items:center;gap:6px}
.cv-contact svg{width:13px;height:13px;flex:none;fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cv-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:22px;border-block:1px solid var(--line)}
.cv-stats>div{padding:12px 16px 13px;border-left:1px solid var(--line)}
.cv-stats>div:first-child{padding-left:0;border-left:0}
.cv-stats dt{font:400 32px/1 var(--d);letter-spacing:-.045em;color:var(--ink)}
.cv-stats dd{margin-top:6px;font-size:11.5px;line-height:1.35;color:var(--muted)}
.cv-sec{margin-top:22px}
.cv-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.cv-note{font-size:11px;color:var(--muted)}
.cv-path{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.cv-path li{position:relative;min-width:0;padding:22px 10px 0 0}
.cv-path li::before{content:"";position:absolute;left:0;right:0;top:5px;border-top:1.5px solid var(--ink)}
.cv-path li.now::before{border-top-style:dashed}
.cv-path li.next::before{display:none}
.cv-path i{position:absolute;left:0;top:0;width:12px;height:12px;border-radius:3px;background:var(--ink)}
.cv-path li.now i{background:var(--lime);box-shadow:0 0 0 1.5px var(--ink)}
.cv-path li.next i{background:#FFFFFF;box-shadow:inset 0 0 0 1.5px var(--faint)}
.cv-path b{display:block;font:500 12.5px/1.25 var(--d);letter-spacing:-.01em;color:var(--ink)}
.cv-path li.next b{color:var(--muted)}
.cv-path small{display:block;margin-top:3px;font-size:10.5px;line-height:1.35;color:var(--muted)}
.cv-two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);column-gap:32px}
.cv-about p{font-size:12.75px;line-height:1.55;color:var(--text)}
.cv-about p+p{margin-top:8px}
.cv-where li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:2px 8px;padding:9px 0;border-top:1px solid var(--line)}
.cv-where li:first-child{padding-top:0;border-top:0}
.cv-where span{grid-row:span 2;font:500 11.5px/1.5 var(--d);color:var(--muted)}
.cv-where b{font:500 14px/1.3 var(--d);letter-spacing:-.01em;color:var(--ink)}
.cv-where p{font-size:12px;line-height:1.45;color:var(--muted)}
/* the same four skill groups as the About page */
.cv-skills{display:grid;grid-template-columns:minmax(0,153fr) minmax(0,177fr) minmax(0,125fr) minmax(0,179fr);column-gap:16px}
.cv-skills>div{padding-top:10px;border-top:1.5px solid var(--ink)}
.cv-skills b{display:block;font:500 13.5px/1.3 var(--d);letter-spacing:-.01em;color:var(--ink)}
/* columns sized to their longest skill, so every skill stays on one line */
.cv-skills ul{margin-top:6px}
.cv-skills li{font-size:11.75px;line-height:1.5;color:var(--text);white-space:nowrap}
.cv-xp>li{display:grid;grid-template-columns:122px minmax(0,1fr);column-gap:20px;align-items:baseline;padding:16px 0;border-top:1px solid var(--line)}
.cv-xp>li:first-child{padding-top:0;border-top:0}
.xp-d{display:block;font:400 11px/1.35 var(--b);letter-spacing:0;color:var(--muted);white-space:nowrap}
.cv-xp h3{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font:400 18px/1.2 var(--d);letter-spacing:-.02em}
.cv-xp ul{display:grid;gap:3px;margin-top:6px}
.cv-xp ul li{text-wrap:pretty;position:relative;padding-left:14px;font-size:12.25px;line-height:1.5;color:var(--text)}
.cv-xp ul li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:1.5px;background:var(--ink)}
.cv-xp li.now ul li::before{background:var(--lime);box-shadow:0 0 0 1px var(--ink)}
.cv-xp li.pair{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
.cv-xp li.pair{align-items:start}
.cv-xp li.pair h3{align-items:baseline;font-size:16px}
.cv-xp li.pair p{margin-top:4px;font-size:12.25px;line-height:1.5;color:var(--text)}
.cv-work li{display:grid;grid-template-columns:122px minmax(0,1fr) auto;column-gap:20px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.cv-work li:first-child{padding-top:0;border-top:0}
.cv-work b{font:500 13.5px/1.3 var(--d);letter-spacing:-.01em;color:var(--ink)}
.cv-work span{font-size:12px;line-height:1.45;color:var(--text)}
.cv-work em{font:500 10.5px/1 var(--d);font-style:normal;color:var(--muted);white-space:nowrap}
.cv-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;margin-top:28px;padding:16px 20px;border-radius:12px;background:var(--paper-2);border:1px solid var(--line)}
.cv-facts h3{margin-bottom:6px;font:500 13.5px/1.3 var(--d);letter-spacing:-.01em}
.cv-facts li{font-size:12px;line-height:1.55;color:var(--text)}
.cv-talk{font:500 12.5px/1.3 var(--d);color:var(--ink)}
.cv-talk a{text-decoration:underline;text-underline-offset:2px}
.cv-dl{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:clamp(24px,3vw,40px);text-align:center}
.dl-note{font-size:14.5px;color:var(--muted)}
.dl-note a{color:var(--ink)}
.btn:hover .ar.dl{transform:translateY(2px)}
/* phones: an A4 page scaled to phone width is unreadable, so the same CV reflows into one column */
@media screen and (max-width:719px){
  .cv-desk{padding-block:20px 36px}
  .cv-fit{width:100%;aspect-ratio:auto}
  .sheet{position:relative;width:100%;height:auto;transform:none!important;border-radius:12px;font-size:14px}
  .sh-grid{height:300px}
  .sh-in{padding:24px 20px 0}

  .cv-loc{font-size:13px;white-space:normal}
  .cv-name{margin-top:14px;font-size:clamp(38px,11.5vw,48px)}
  .cv-tag{margin-top:10px;font-size:20px}
  .cv-lede{font-size:15px}
  .cv-contact{flex-direction:column;align-items:flex-start;gap:10px;font-size:14px}
  .cv-contact li{max-width:100%}
  .cv-contact a{min-width:0;overflow-wrap:anywhere}
  .cv-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cv-stats>div:nth-child(3){padding-left:0;border-left:0}
  .cv-stats>div:nth-child(n+3){border-top:1px solid var(--line)}
  .cv-stats dt{font-size:30px}
  .cv-stats dd{font-size:13px}
  .cv-sec{margin-top:30px}
  .cv-h{flex-wrap:wrap;row-gap:8px}
  .cv-note{font-size:12.5px}
  .cv-path{grid-template-columns:1fr}
  .cv-path li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 0 16px 28px}
  .cv-path li::before{left:5px;right:auto;top:16px;bottom:-2px;border-top:0;border-left:1.5px solid var(--ink)}
  .cv-path li.now::before{border-left-style:dashed}

/* ---------------- typesetting ---------------- */
/* never end a heading line on a short word: bind it to the word after it */
const SHORT = /(^|[\s ])(a|an|the|to|of|and|for|is|be|that|in|on|or|by|at|as|from|with)[ \t\n\r]+(?=\S)/gi;
const SHORT_END = /(^|[\s ])(a|an|the|to|of|and|for|is|be|that|in|on|or|by|at|as|from|with)[ \t\n\r]+$/i;
function bindShortWords(root){
  root.querySelectorAll("h1, h2, h3, .deck").forEach(el=>{
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n;
    while((n = w.nextNode())){ if(n.parentElement.closest(".nw")) continue; for(let i=0;i<3;i++) n.data = n.data.replace(SHORT, (m, pre, word)=>pre + word + "\xa0");
      /* a short word that ends a run of text, just before a marked phrase, joins that phrase in one unbroken span */
      const nx = n.nextSibling, m = nx && nx.nodeType === 1 ? n.data.match(SHORT_END) : null;
      if(m){
        const at = m.index + m[1].length, word = m[2];
        n.data = n.data.slice(0, at);
        const wrap = document.createElement("span"); wrap.className = "nw";
        nx.parentNode.insertBefore(wrap, nx); wrap.append(word + "\xa0", nx);
      } }
  });
}
/* no paragraph ends on a single word: bind its last two words */
function bindLastWords(root){
  bindShortWords(root);
  queueMicrotask(()=>sepLists(root));
  root.querySelectorAll("p, .tbl .td, h2, h3, .deck, .stat span, .tq").forEach(p=>{
    const words = p.textContent.trim().split(/\s+/);
    if(words.length < 3) return;
    const w = document.createTreeWalker(p, NodeFilter.SHOW_TEXT); const nodes = []; let n;
    while((n = w.nextNode())) nodes.push(n);
    let seen = false;
    for(let i = nodes.length-1; i >= 0; i--){
      const inNw = nodes[i].parentElement.closest(".nw"), t = nodes[i].data;
      for(let j = t.length-1; j >= 0; j--){
        if(t[j] === "\xa0" && seen) return;
        if(t[j] === " "){
          if(seen && !inNw){
            /* the run this joins, back to the previous breakable space, must stay short enough to wrap */
            const full = p.textContent.replace(/\s+$/,""), after = nodes.slice(i+1).reduce((a,x)=>a+x.data.length,0);
            const at = Math.min(full.length, p.textContent.length - after - (t.length - j)), prev = full.lastIndexOf(" ", at - 1);
            if(full.length - (prev + 1) > 22) return;
            nodes[i].data = t.slice(0,j) + "\xa0" + t.slice(j+1); return;
          }
        }
        else if(t[j].trim()) seen = true;
      }
    }
  });
}
/* "a · b · c" lists: items never split, and a separator that ends a line is hidden */
const DOTTED = ".snap dd, .skills p";
function sepLists(root){
  root.querySelectorAll(DOTTED).forEach(el=>{
    if(el.dataset.sep) return;

/* lime markers draw themselves when their heading comes into view */
function initMarkers(){
  const els = [...app.querySelectorAll(".mk")];
  if(RM.matches || !("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("in")); return; }
  const io = new IntersectionObserver((es)=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {rootMargin:"0px 0px -8% 0px"});
  els.forEach(e=>io.observe(e));

/* work cards pile up: each card shrinks a little as the next one slides over it */
function initPiles(){
  const piles = [...app.querySelectorAll(".pile")]; if(!piles.length) return;
  const mq = matchMedia("(min-width: 901px) and (min-height: 660px)");
  let tops = [], raf = 0;
  const measure = ()=>{ tops = piles.map(p=>[...p.children].map(c=>parseFloat(getComputedStyle(c).top)||0)); };
  const update = ()=>{
    raf = 0;
    const on = mq.matches && !RM.matches;
    piles.forEach((pile, pi)=>{
      const cards = [...pile.children];
      if(!on){ cards.forEach(c=>c.style.removeProperty("--k")); return; }
      const cover = cards.map((c,j)=>{
        if(!j) return 0;
        const prev = cards[j-1], H = prev.offsetHeight, st = tops[pi][j-1];
        return Math.min(1, Math.max(0, (st + H - c.getBoundingClientRect().top) / Math.max(1, H - 14)));
      });
      let acc = 0;
      for(let k = cards.length-1; k >= 0; k--){ cards[k].style.setProperty("--k", acc.toFixed(3)); acc += cover[k]; }
    });
  };
  const onScroll = ()=>{ if(!raf) raf = requestAnimationFrame(update); };
  const onResize = ()=>{ measure(); onScroll(); };
  measure(); update();
  addEventListener("scroll", onScroll, {passive:true});
  addEventListener("resize", onResize);
  onLeave(()=>{ removeEventListener("scroll", onScroll); removeEventListener("resize", onResize); cancelAnimationFrame(raf); });
}
/* the screens inside a card drift with the pointer */
function initParallax(){
  if(!FINE.matches || RM.matches) return;
  app.querySelectorAll(".scard").forEach(card=>{
    const v = card.querySelector(".vis"); if(!v) return;
    card.addEventListener("pointermove",(e)=>{
      const r = v.getBoundingClientRect();
      v.style.setProperty("--mx", ((e.clientX - r.left) / r.width - .5).toFixed(3));
      v.style.setProperty("--my", ((e.clientY - r.top) / r.height - .5).toFixed(3));
    });
    card.addEventListener("pointerleave",()=>{ v.style.setProperty("--mx","0"); v.style.setProperty("--my","0"); });
  });
}

function initTestimonials(){
  const root = app.querySelector("#testimonials"); if(!root) return;
  const slides = [...root.querySelectorAll(".tslide")], segs = [...root.querySelectorAll(".tseg")];
  if(slides.length < 2) return;
  /* autoplay: the current bar fills, then the next quote comes in; with reduced motion, the arrows and bars still work */
  const auto = !RM.matches;
  root.classList.toggle("static", !auto);
  let i = 0;
  const holds = new Set();
  const hold = (why, on)=>{ if(on) holds.add(why); else holds.delete(why); root.classList.toggle("paused", holds.size > 0); };
  const go = (n)=>{
    i = (n + slides.length) % slides.length;
    slides.forEach((s,j)=>{ s.classList.toggle("on", j===i); if(j===i) s.removeAttribute("aria-hidden"); else s.setAttribute("aria-hidden","true"); });

    g.querySelector("i").addEventListener("animationend",()=>{ if(auto && j===i) go(i+1); });
  });
  root.querySelector(".tarrow.prev").addEventListener("click",()=>go(i-1));
  root.querySelector(".tarrow.next").addEventListener("click",()=>go(i+1));

  root.addEventListener("pointerenter",(e)=>{ if(e.pointerType === "mouse") hold("hover", true); });
  root.addEventListener("pointerleave",()=>hold("hover", false));
  root.addEventListener("focusin",(e)=>{ if(e.target.matches(":focus-visible")) hold("focus", true); });
  root.addEventListener("focusout",(e)=>{ if(!root.contains(e.relatedTarget)) hold("focus", false); });
  if("IntersectionObserver" in window){
    const io = new IntersectionObserver(([e])=>hold("view", !e.isIntersecting), {threshold:.4});
    io.observe(root); onLeave(()=>io.disconnect());
  }
  const onVis = ()=>hold("tab", document.hidden);
  document.addEventListener("visibilitychange", onVis); onLeave(()=>document.removeEventListener("visibilitychange", onVis));
  const area = root.querySelector(".tslides"); let x0 = null;
  area.addEventListener("pointerdown",(e)=>{ x0 = e.clientX; });
  area.addEventListener("pointerup",(e)=>{ if(x0 === null) return; const dx = e.clientX - x0; x0 = null; if(Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1)); });
  go(0);
}
/* FAQ: one answer open at a time; opening another closes the previous */
function initFaq(){
  const items = [...app.querySelectorAll(".qa")];
  items.forEach(li=>li.querySelector("button").addEventListener("click",()=>{
    const open = !li.classList.contains("open");
    items.forEach(o=>{ const on = o===li && open; o.classList.toggle("open", on); o.querySelector("button").setAttribute("aria-expanded", String(on)); });
  }));
}
function initCopy(){
  app.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>{
    const flag = app.querySelector("#copied"), lbl = b.querySelector(".lbl");
    const done = ()=>{ flag.textContent = "Copied to clipboard"; flag.hidden = false; if(lbl) lbl.textContent = "Copied";
      clearTimeout(b._t); b._t = setTimeout(()=>{ flag.hidden = true; if(lbl) lbl.textContent = "Copy email"; }, 3200); };
    const select = ()=>{ const r = document.createRange(); r.selectNodeContents(app.querySelector("#mail")); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      flag.textContent = "Selected, ready to copy"; flag.hidden = false; };
    try{ navigator.clipboard.writeText(EMAIL).then(done, select); }catch(_){ select(); }
  }));
}
function initPage(){
  initMarkers(); initPiles(); initParallax();
  initAccordion(); initTestimonials(); initFaq(); initCopy(); initCvFit();
}

/* nav: hairline once scrolled */
let navTick = false;
function onScrollNav(){
  nav.classList.toggle("stuck", scrollY > 40);
  updateBelt();
}
/* jump belt: joins the header once it reaches it, and underlines the section in view */
const beltOffset = (b)=>nav.offsetHeight + b.offsetHeight + 28;
const secTop = (sec)=>Math.min(...[sec.querySelector(".c-lbl"), sec.querySelector("h2")].filter(Boolean).map(e=>e.getBoundingClientRect().top), sec.getBoundingClientRect().bottom);
function updateBelt(){
  const b = app.querySelector("#jump");
  if(!b){ nav.classList.remove("belted"); return; }
  const r = b.getBoundingClientRect();
  nav.classList.toggle("belted", r.top <= nav.getBoundingClientRect().bottom + .5);
  const line = r.bottom + 48;
  let cur = null;
  b.querySelectorAll("a").forEach(a=>{
    const sec = document.getElementById(a.getAttribute("href").slice(1));
    if(sec && secTop(sec) <= line) cur = a;
  });
  b.querySelectorAll("a").forEach(a=>{ if(a===cur) a.setAttribute("aria-current","true"); else a.removeAttribute("aria-current"); });
  if(cur !== b._cur){
    const sc = b.querySelector(".jump-in"), how = RM.matches ? "auto" : "smooth";
    if(cur){
      const L = cur.offsetLeft, R = L + cur.offsetWidth;
      if(L < sc.scrollLeft + 16 || R > sc.scrollLeft + sc.clientWidth - 16) sc.scrollTo({left:Math.max(0, L - 24), behavior:how});
    } else if(sc.scrollLeft) sc.scrollTo({left:0, behavior:how}); /* back above the first section: show the belt from its start */
  }
  b._cur = cur;
}
addEventListener("scroll",()=>{ if(!navTick){ navTick = true; requestAnimationFrame(()=>{ navTick = false; onScrollNav(); }); } }, {passive:true});
let dotsRaf = 0;
addEventListener("resize",()=>{ cancelAnimationFrame(dotsRaf); dotsRaf = requestAnimationFrame(()=>{ layoutDots(document); updateBelt(); }); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>layoutDots(document));

function closeMenu(){ mnav.hidden = true; menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.addEventListener("click",()=>{ const open = mnav.hidden; mnav.hidden = !open; menuBtn.setAttribute("aria-expanded", String(open)); });
addEventListener("keydown",(e)=>{ if(e.key==="Escape" && !mnav.hidden){ closeMenu(); menuBtn.focus(); } });

/* ---------------- router ---------------- */
const PAGES = ["work","about","cv"];
const HOME_SECTIONS = ["top","selected","services","process","testimonials","me","faq","contact"];
let view = "home";
function markNav(){
  const page = CASES.some(c=>c.slug===view) ? "work" : view==="cv" ? "about" : view;
  document.querySelectorAll(".nav-links a").forEach(a=>{
    if(a.getAttribute("href")==="#"+page && PAGES.includes(page)) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
}
function route(){
  teardown(); closeMenu();
  const hash = (location.hash||"").replace(/^#/,"");
  const found = CASES.find(c=>c.slug===hash);
  if(found){ view = found.slug; app.innerHTML = renderCase(found); document.title = plain(found.title) + " · Nilesh Meghani"; }
  else if(hash==="work"){ view = "work"; app.innerHTML = renderWork(); document.title = "Work · Nilesh Meghani"; }
  else if(hash==="about"){ view = "about"; app.innerHTML = renderAbout(); document.title = "About · Nilesh Meghani"; }
  else if(hash==="cv"){ view = "cv"; app.innerHTML = renderCV(); document.title = "Nilesh Meghani · CV"; }
  else { view = "home"; app.innerHTML = renderHome(); document.title = "Nilesh Meghani · Senior Product Designer"; }
  document.documentElement.classList.toggle("on-cv", view==="cv");
  markNav();
  bindLastWords(app);
  initPage();
  const el = view==="home" && hash && hash!=="top" && HOME_SECTIONS.includes(hash) ? document.getElementById(hash) : null;
  if(el) el.scrollIntoView({block:"start"}); else window.scrollTo(0,0);
  onScrollNav();
}

/* in-page links scroll; page and case links route */
document.addEventListener("click",(e)=>{
  const a = e.target.closest("a[href^='#']"); if(!a) return;
  const target = a.getAttribute("href").slice(1);
  const behavior = RM.matches ? "auto" : "smooth";
  if(a.hasAttribute("data-totop") || (target==="top" && view==="home") || (PAGES.includes(target) && view===target)){
    e.preventDefault(); closeMenu(); window.scrollTo({top:0, behavior}); return;
  }
  const isRoute = PAGES.includes(target) || CASES.some(c=>c.slug===target) || target==="top" || target==="";
  if(!isRoute){
    const el = document.getElementById(target), belt = a.closest("#jump");
    if(el && belt){
      e.preventDefault();
      window.scrollTo({top:Math.max(0, secTop(el) + scrollY - beltOffset(belt)), behavior});
      return;
    }
    if(el){ e.preventDefault(); closeMenu(); el.scrollIntoView({behavior, block:"start"}); }
  }
});

window.addEventListener("hashchange", route);
route();
